<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Login</title>

    <link
        rel="stylesheet"
        href="student-login.css"
    >

</head>


<body>

    <div class="background-overlay"></div>


    <main class="login-page">


        <a
            href="../index.html"
            class="back-button"
        >
            ← Back
        </a>


        <div class="login-card">


            <div class="logo-container">

                <img
                    src="../../assets/college-logo.jpeg"
                    alt="College Logo"
                >

            </div>


            <div class="login-heading">

                <span>STUDENT ACCESS</span>

                <h1>STUDENT PORTAL</h1>

                <p>
                    Access your academic materials
                    and academic information.
                </p>

            </div>


            <form id="studentLoginForm">


                <div class="input-group">

                    <label>
                        Registration ID
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter Registration ID"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="studentPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label>

                        <input type="checkbox">

                        Remember me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >

                    Login to Student Portal
                    <span>→</span>

                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>


            </form>


            <div class="security-note">

                🔒 Secure Student Access

            </div>


        </div>

    </main>


    <script src="student-login.js"></script>

</body>

</html>
