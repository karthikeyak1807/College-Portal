<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HOD Admin Login</title>

    <link
        rel="stylesheet"
        href="admin-login.css"
    >

</head>


<body>

    <div class="background-overlay"></div>


    <main class="login-page">


        <!-- Back Button -->

        <a
            href="../index.html"
            class="back-button"
        >
            ← Back
        </a>


        <!-- Login Card -->

        <div class="login-card">


            <div class="logo-container">

                <img
                    src="../../assets/college-logo.jpeg"
                    alt="College Logo"
                >

            </div>


            <div class="login-heading">

                <span>MASTER CONTROL</span>

                <h1>HOD / ADMIN</h1>

                <p>
                    Login to access the college
                    administration portal.
                </p>

            </div>


            <form id="adminLoginForm">


                <!-- Admin ID -->

                <div class="input-group">

                    <label for="adminId">
                        Admin / HOD ID
                    </label>

                    <input
                        type="text"
                        id="adminId"
                        placeholder="Enter your ID"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >

                    Login to Admin Portal
                    <span>→</span>

                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>


            </form>


            <div class="security-note">

                🔒 Secure Admin Access

            </div>


        </div>

    </main>


    <script src="admin-login.js"></script>

</body>

</html>
