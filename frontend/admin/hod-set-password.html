<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Set Your Password - College Portal</title>

    <link rel="stylesheet" href="hod-set-password.css">
</head>

<body>

    <div class="page-container">

        <div class="password-card">

            <div class="logo-area">
                <div class="logo-circle">🎓</div>
            </div>

            <h1>Set Your Password</h1>

            <p class="subtitle">
                Create a secure password for your HOD Portal account.
            </p>

            <form id="passwordForm">

                <div class="form-group">

                    <label for="password">
                        New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your new password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="passwordToggle"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter your password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="confirmPasswordToggle"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="password-hint">
                    Password must contain at least 6 characters.
                </div>


                <button
                    type="submit"
                    id="setPasswordBtn"
                >
                    Set Password
                </button>

            </form>


            <div
                id="message"
                class="message"
                style="display: none;"
            ></div>


            <div
                id="loading"
                class="loading"
                style="display: none;"
            >
                Setting your password...
            </div>

        </div>

    </div>


    <script src="hod-set-password.js"></script>

</body>

</html>
